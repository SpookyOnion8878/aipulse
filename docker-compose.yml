name: aipulse

x-aipulse-image: &aipulse-image
  build:
    context: .
    dockerfile: Dockerfile
  image: aipulse:local
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true

services:
  api:
    <<: *aipulse-image
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AIPULSE_ENV: ${AIPULSE_ENV:-development}
      AIPULSE_JWT_SECRET: ${AIPULSE_JWT_SECRET:-}
      AIPULSE_JWT_ISSUER: ${AIPULSE_JWT_ISSUER:-aipulse}
      AIPULSE_JWT_AUDIENCE: ${AIPULSE_JWT_AUDIENCE:-aipulse-api}
      AIPULSE_CORS_ORIGINS: ${AIPULSE_CORS_ORIGINS:-http://localhost:8080,http://localhost:8081}
      AIPULSE_DATA_DIR: /app/data
      AIPULSE_MODELS_DIR: /app/models
      AIPULSE_LOGS_DIR: /app/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  dashboard:
    <<: *aipulse-image
    command:
      - streamlit
      - run
      - /app/src/frontend/dashboard.py
      - --server.address=0.0.0.0
      - --server.port=8080
      - --server.headless=true
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      AIPULSE_API_URL: http://api:8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/_stcore/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  admin:
    <<: *aipulse-image
    command:
      - streamlit
      - run
      - /app/src/frontend/admin_panel.py
      - --server.address=0.0.0.0
      - --server.port=8080
      - --server.headless=true
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      AIPULSE_API_URL: http://api:8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/_stcore/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
