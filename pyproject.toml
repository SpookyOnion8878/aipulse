[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aipulse"
version = "0.2.0"
description = "A small, production-minded AI lifecycle platform"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
authors = [{ name = "AIPulse Contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "joblib>=1.4,<2",
  "numpy>=2.0,<2.3; python_version < '3.14'",
  "numpy>=2.3,<3; python_version >= '3.14'",
  "pandas>=2.2,<4",
  "pyarrow>=16,<27",
  "pydantic>=2.9,<3",
  "PyJWT[crypto]>=2.9,<3",
  "python-multipart>=0.0.20,<1",
  "PyYAML>=6,<7",
  "requests>=2.32,<3",
  "scikit-learn>=1.5,<2",
  "streamlit>=1.40,<2",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pandas-stubs>=2.2",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "types-PyYAML>=6,<7",
  "types-requests>=2.32,<3",
]

[project.scripts]
aipulse-api = "aipulse.system.api_gateway:run"
aipulse-pipeline = "aipulse.data_engineering.data_pipeline:main"
aipulse-train = "aipulse.core.model_training:main"

[tool.setuptools]
package-dir = { aipulse = "src" }
packages = [
  "aipulse",
  "aipulse.core",
  "aipulse.data_engineering",
  "aipulse.frontend",
  "aipulse.security",
  "aipulse.system",
]

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
explicit_package_bases = true
strict = true
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["joblib", "joblib.*", "sklearn", "sklearn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
